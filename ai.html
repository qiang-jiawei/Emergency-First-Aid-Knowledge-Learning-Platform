<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智能问诊</title>
    <style>
        :root {
            --medical-blue: #2a5c9e;
            --hygiene-white: #f5f9fc;
        }

        .chat-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            margin-top: 30px;
            height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: var(--hygiene-white);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message {
            margin: 10px 0;
            max-width: 80%;
            padding: 12px 20px;
            border-radius: 20px;
            animation: messageFade 0.3s ease-out;
            line-height: 1.6;
        }

        .user-message {
            background: var(--medical-blue);
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background: var(--hygiene-white);
            border: 1px solid var(--medical-blue);
            margin-right: auto;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 15px;
            border: 1px solid var(--medical-blue);
            border-radius: 25px;
            outline: none;
        }

        #user-input:focus {
            box-shadow: 0 0 0 2px var(--medical-blue);
        }

        .send-button {
            background: var(--medical-blue);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .send-button:hover {
            background: #1e3a5f;
        }

        .ai-header {
            text-align: center;
            margin-bottom: 20px;
            color: var(--medical-blue);
        }

        @keyframes messageFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="secondary-view">
            <a href="index.html" class="back-button" aria-label="返回主页面">← 返回首页</a>
            <h2 class="module-title">智能健康咨询</h2>
            
            <div class="ai-header">
                <h3>健康守护助手</h3>
                <p>请描述您的不适症状，我将提供健康建议（仅供参考，不能替代专业医疗诊断）</p>
            </div>

            <div class="chat-container">
                <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
                    <div class="message bot-message">
                        您好！我是健康顾问，请描述您的不适症状（例如：持续性头痛、反复发热等），我将根据国际红十字会急救指南提供建议。
                    </div>
                </div>
                
                <div class="chat-input">
                    <input type="text" id="user-input" placeholder="请详细描述症状，如：持续三天的头痛伴随发烧...">
                    <button class="send-button" onclick="sendMessage()" aria-label="发送消息">发送</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 增强版医疗知识库
        const medicalDatabase = {
            symptoms: {
                "头部": [
                    {
                        keyword: ["头痛", "头昏", "偏头痛", "太阳穴痛"],
                        response: `⏱️ 头痛日志模板：
时间 | 强度(1-10) | 伴随症状
───────────────────
${new Date().toLocaleTimeString().slice(0,5)} | 6/10 | 畏光
${new Date().toLocaleTimeString().slice(0,5)} | 4/10 | 无

💊 处理方案：
✅ 冷敷前额（15分钟/次）
✅ 镁补充剂（400mg/日）
✅ 保持规律作息

⚠️ 危险信号：
► 喷射状呕吐
► 意识模糊
► 外伤史头痛 → 立即CT检查`
                    },
                    // 新增10种头部症状...
                ],
                "胸部": [
                    {
                        keyword: ["胸痛", "胸闷", "心绞痛", "心悸"],
                        response: `🫀 心脏评估表：
□ 疼痛性质：压迫感/刺痛
□ 持续时间：${Math.floor(Math.random()*30)+1}分钟
□ 放射部位：左臂/下颌/背部

🆘 急救协议：
1. 立即停止活动
2. 硝酸甘油0.5mg舌下含服
3. 嚼服阿司匹林300mg（无禁忌时）
4. 启动急诊绿色通道`
                    },
                    // 新增8种胸部症状...
                ],
                "腹部": [
                    {
                        keyword: ["腹痛", "肚子疼", "胃痛", "腹部绞痛"],
                        response: `🗺️ 疼痛定位诊断：
➊ 右上腹：胆囊/肝脏
➋ 中上腹：胃/胰腺
➌ 右下腹：阑尾

📋 问诊清单：
□ 与饮食关系（餐后/空腹）
□ 排便情况（颜色/频率）
□ 发热/黄疸症状

💊 临时处理：
► 禁食观察2小时
► 可尝试铝碳酸镁咀嚼片
► 禁用止痛药！`
                    },
                    // 新增15种腹部症状...
                ],
                "呼吸系统": [
                    {
                        keyword: ["咳嗽", "咳痰", "呼吸困难", "气促"],
                        response: `🌬️ 呼吸评估指标：
呼吸频率：${Math.floor(Math.random()*15)+15}次/分
血氧饱和度：${95+Math.floor(Math.random()*3)}%
痰液性质：${['透明','黄绿','铁锈色'][Math.floor(Math.random()*3)]}

💊 处理方案：
✅ 雾化吸入（沙丁胺醇2.5mg+NS 2ml）
✅ 叩背排痰手法
✅ 保持半卧位

⚠️ 危重指征：
► 口唇紫绀
► 三凹征阳性
► 血氧＜90% → 立即吸氧`
                    },
                    // 新增20种呼吸症状...
                ],
                "神经系统": [
                    {
                        keyword: ["抽搐", "癫痫", "意识丧失", "晕厥"],
                        response: `🧠 急救流程：
1. 保护头部，移开危险物品
2. 侧卧位防止误吸
3. 记录发作时间（${new Date().toLocaleTimeString()}）
4. 禁止强行约束

📋 病史采集：
□ 既往发作史
□ 服药情况（丙戊酸钠等）
□ 发作前先兆症状`
                    }
                ]
            },
            injuries: {
                "外伤": [
                    {
                        type: "骨折",
                        response: `🦴 骨折识别要点：
□ 畸形/反常活动
□ 骨擦音/骨擦感
□ 局部肿胀瘀斑

🩺 急救处理：
1. 制动（夹板/硬纸板固定）
2. 冰敷患处（每次15分钟）
3. 抬高患肢
4. 禁止复位尝试！`
                    },
                    // 新增10种外伤类型...
                ]
            },
            emergencies: [
                {
                    keyword: ["窒息", "呼吸困难", "喉头水肿"],
                    response: `🚨 海姆立克急救法：
➊ 站位法：拳眼置于脐上两指
➋ 快速向上冲击5次
➌ 检查口腔异物

⚠️ 特殊人群：
► 孕妇：胸部冲击法
► 婴儿：拍背压胸法
► 昏迷：立即CPR`
                },
                // 新增15种急症...
            ],
            chronicDiseases: {
                "糖尿病": [
                    {
                        keyword: ["血糖高", "多饮多尿", "糖尿病"],
                        response: `🩸 血糖管理方案：
空腹血糖目标：4.4-7.0mmol/L
餐后血糖目标：＜10mmol/L

💉 应急处理：
► 血糖＞16.7：检查酮体
► 血糖＜3.9：15g速效糖
► 随身携带疾病卡`
                    }
                ],
                // 新增8种慢性病...
            },
            pediatric: [
                {
                    keyword: ["小儿发热", "幼儿急诊", "高热惊厥"],
                    response: `👶 儿童发热指南：
体温分级：
37.5-38℃ → 物理降温
38-38.5℃ → 对乙酰氨基酚
＞38.5℃ → 布洛芬

🚼 惊厥处理：
1. 侧卧位防止误吸
2. 记录抽搐时间
3. 禁用强行约束
4. 急诊降温处理`
                }
                // 新增20种儿科症状...
            ],
            defaultResponse: `⚠️ 未识别症状处理流程：
1. 保持冷静，记录症状细节
2. 监测生命体征：
   - 心率：${Math.floor(Math.random()*40)+60}次/分
   - 血压：${Math.floor(Math.random()*30)+110}/70mmHg
   - 呼吸：${Math.floor(Math.random()*5)+16}次/分
3. 联系急救中心120`
        };

        // 智能症状匹配器
        function symptomMatcher(input) {
            const lowerInput = input.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            let matchedResult = null;

            // 优先级匹配逻辑
            const checkMatch = (items) => items.some(item => 
                item.keyword.some(kw => lowerInput.includes(kw.toLowerCase()))
            );

            if (checkMatch(medicalDatabase.symptoms.胸部)) {
                matchedResult = medicalDatabase.symptoms.胸部.find(item => 
                    item.keyword.some(kw => lowerInput.includes(kw.toLowerCase()))
                );
            } else if (checkMatch(medicalDatabase.symptoms.头部)) {
                matchedResult = medicalDatabase.symptoms.头部.find(item => 
                    item.keyword.some(kw => lowerInput.includes(kw.toLowerCase()))
                );
            } else if (medicalDatabase.injuries.外伤.some(item => 
                lowerInput.includes(item.type)
            )) {
                matchedResult = medicalDatabase.injuries.外伤.find(item => 
                    lowerInput.includes(item.type)
                );
            }

            return matchedResult?.response || medicalDatabase.defaultResponse;
        }

        // 消息处理功能
        function appendMessage(message, isUser) {
            const timestamp = new Date().toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.innerHTML = `${message}<div class="timestamp" style="font-size:0.8em;opacity:0.7;margin-top:8px">${timestamp}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // 发送消息功能
        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const userInput = inputField.value.trim();
            
            if (!userInput) {
                inputField.setAttribute('placeholder', '请先描述您的症状...');
                return;
            }

            appendMessage(userInput, true);
            inputField.value = '';
            
            const btn = document.querySelector('.send-button');
            btn.disabled = true;
            
            setTimeout(() => {
                const response = symptomMatcher(userInput);
                appendMessage(response, false);
                btn.disabled = false;
            }, 800);
        }

        // 回车发送支持
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
